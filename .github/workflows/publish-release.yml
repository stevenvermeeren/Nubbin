name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish NuGet package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore Nubbin.slnx

      - name: Build
        run: dotnet build Nubbin.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Nubbin.slnx --configuration Release --no-build

      - name: Pack release
        run: >-
          dotnet pack Nubbin/Nubbin.csproj
          --configuration Release
          --no-build
          --no-restore
          --output ./artifacts/release

      - name: Log in to NuGet with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Publish to NuGet
        run: >-
          dotnet nuget push ./artifacts/release/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate